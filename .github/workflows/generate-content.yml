name: Generate content draft

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: Source Markdown path under posts/
        required: true
        type: string
      platform:
        description: Target platform
        required: true
        type: choice
        options: [linkedin, x, devto, medium]
      format:
        description: Target format
        required: true
        type: choice
        options: [short, mid, full]
      target_language:
        description: Output language
        required: true
        type: choice
        options: [tr, en]
      model:
        description: Ollama Cloud model for LinkedIn and X drafts
        required: false
        default: gpt-oss:120b-cloud
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the canonical source
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate request
        run: |
          node scripts/generate-content.mjs \
            --source "${{ inputs.source_path }}" \
            --platform "${{ inputs.platform }}" \
            --format "${{ inputs.format }}" \
            --language "${{ inputs.target_language }}" \
            --validate true
      - name: Generate draft package
        id: generate
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ inputs.model }}
          OLLAMA_BASE_URL: https://api.ollama.com/v1/
          SITE_URL: https://yildizib.github.io
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_COMMIT="$SOURCE_COMMIT" node scripts/generate-content.mjs \
            --source "${{ inputs.source_path }}" \
            --platform "${{ inputs.platform }}" \
            --format "${{ inputs.format }}" \
            --language "${{ inputs.target_language }}"
      - name: Create tracking issue
        id: issue
        uses: actions/github-script@v7
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          PLATFORM: ${{ inputs.platform }}
          FORMAT: ${{ inputs.format }}
          TARGET_LANGUAGE: ${{ inputs.target_language }}
        with:
          script: |
            const title = `Generate ${process.env.PLATFORM} ${process.env.FORMAT} draft`;
            const body = [
              "## Goal",
              "Generate a reviewable content draft from a canonical blog post.",
              "",
              "## Scope",
              `- Source: \`${process.env.SOURCE_PATH}\``,
              `- Platform: ${process.env.PLATFORM}`,
              `- Format: ${process.env.FORMAT}`,
              `- Target language: ${process.env.TARGET_LANGUAGE}`,
              "",
              "## Acceptance criteria",
              "- The generated Markdown includes complete provenance metadata.",
              "- The draft follows the repository and platform rules under `.agents/`.",
              "- A pull request is opened for human review."
            ].join("\n");
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              assignees: [context.repo.owner]
            });
            core.setOutput("number", issue.data.number);
      - name: Create branch and commit draft
        id: commit
        env:
          OUTPUT_PATH: ${{ steps.generate.outputs.output_path }}
          PLATFORM: ${{ inputs.platform }}
          FORMAT: ${{ inputs.format }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          BRANCH="content/${PLATFORM}-${FORMAT}-${ISSUE_NUMBER}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_PATH"
          git commit -m "Generate ${PLATFORM} ${FORMAT} draft"
          git push origin "$BRANCH"
          printf 'branch=%s\n' "$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Open review pull request
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          OUTPUT_PATH: ${{ steps.generate.outputs.output_path }}
          SOURCE_PATH: ${{ inputs.source_path }}
          PLATFORM: ${{ inputs.platform }}
          FORMAT: ${{ inputs.format }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        with:
          script: |
            const title = `Draft: ${process.env.PLATFORM} ${process.env.FORMAT} from ${process.env.SOURCE_PATH}`;
            const body = [
              "This draft was generated for human review.",
              "",
              `- Source: \`${process.env.SOURCE_PATH}\``,
              `- Generated file: \`${process.env.OUTPUT_PATH}\``,
              `- Platform: ${process.env.PLATFORM}`,
              `- Format: ${process.env.FORMAT}`,
              "",
              "Review factual fidelity, tone, metadata, and platform fit before merging.",
              "",
              `Closes #${process.env.ISSUE_NUMBER}`
            ].join("\n");
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: process.env.BRANCH,
              base: "master",
              body
            });
